<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>x-ocaml: a base URL elsewhere</title>
  <!-- The page is in /sub/, but its base is the site root. -->
  <base href="../">
  <link rel="stylesheet" href="test.css">
  <script src="lib.js"></script>
</head>
<body>
<main>
  <p class="lede">This page lives in /sub/, but its base URL is the site root, which is where its scripts are.</p>

  <section class="case" data-case="B1">
    <h2>A cell</h2>
    <x-ocaml id="c">let based = 1</x-ocaml>
  </section>

</main>

  <script src="x-ocaml.js" src-worker="x-ocaml.worker.js"></script>
  <script>
    async function run() {
      check('B1: the worker is found against the page\'s base URL, not its directory',
        await waitFor(() => output('c').includes('val based'), 30000));
      noPageErrors();
      window.testResults.done = true;
    }
    run();
  </script>
</body>
</html>
